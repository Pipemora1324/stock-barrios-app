services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-barrios-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_barrios
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock_barrios"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: stock-barrios-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://stock:stock@postgres:5432/stock_barrios
      JWT_SECRET: desarrollo-local-cambio-obligatorio
      CORS_ORIGIN: http://localhost:4200
      AI_PROVIDER: local
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: stock-barrios-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
